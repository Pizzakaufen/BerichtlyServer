# Berichtly Server 2.0 – Admin-Dashboard (optional, standardmäßig NICHT eingebunden).
# Ziel: /etc/nginx/snippets/berichtly-admin.conf
#
# Einbinden nur im HTTPS-Server-Block (nie im HTTP- oder IP-Block ohne TLS):
#     include /etc/nginx/snippets/berichtly-admin.conf;
# und zusätzlich in der .env: ADMIN_DASHBOARD_ENABLED=true
#
# Empfehlung: Zugriff zusätzlich auf bekannte Adressen beschränken (Heimnetz, VPN). Ohne allow/deny ist das
# Dashboard für jeden erreichbar, der die Adresse kennt – geschützt nur durch Anmeldung, Rate-Limits und Sperre.

location /admin {
    # allow 192.168.178.0/24;   # Beispiel: Heimnetz
    # allow 10.8.0.0/24;        # Beispiel: WireGuard-VPN
    # deny all;
    limit_req zone=berichtly_auth burst=20 nodelay;
    include /etc/nginx/snippets/berichtly-proxy.conf;
}
