# Berichtly Server 1.2 – Weiterleitung an Node.js (eingebunden in den API-Locations).
# Ziel: /etc/nginx/snippets/berichtly-proxy.conf
#
# Methoden, Bodies, Query-Strings, Statuscodes und alle Header – auch Authorization – werden unverändert
# weitergereicht. Node.js vertraut genau einem Proxy (TRUST_PROXY=true): Client-IP ist der letzte Eintrag in
# X-Forwarded-For, den Nginx selbst anhängt; vom Client gefälschte Einträge davor werden ignoriert.

proxy_pass http://berichtly_upstream;
proxy_http_version 1.1;
proxy_set_header Connection        "";   # Keep-Alive zum Upstream
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
proxy_set_header X-Request-ID      $berichtly_request_id;

proxy_connect_timeout 5s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;
# Nicht-idempotente Anfragen (POST/PATCH) nie automatisch wiederholen.
proxy_next_upstream off;
proxy_redirect off;

# HSTS setzt Nginx (nur über HTTPS); eine doppelte Angabe von Node.js wird entfernt.
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security $berichtly_hsts always;
