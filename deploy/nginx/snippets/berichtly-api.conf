# Berichtly Server 1.2 – gemeinsame Locations für HTTP- und HTTPS-Server (eingebunden im server-Block).
# Ziel: /etc/nginx/snippets/berichtly-api.conf

# Standard-Logdateien: unter Linux rotiert logrotate (Nginx-Paket), im Docker-Image gehen sie nach stdout/stderr.
access_log /var/log/nginx/access.log berichtly_json;
error_log  /var/log/nginx/error.log warn;

# Keine Versionsnummer im Server-Header und auf Fehlerseiten.
server_tokens off;

# Muss mindestens MAX_REQUEST_BODY_BYTES entsprechen (Standard 1 MiB). Node.js prüft zusätzlich selbst.
client_max_body_size 1m;
client_body_timeout   30s;
client_header_timeout 15s;
send_timeout          60s;
keepalive_timeout     65s;
keepalive_requests    1000;
limit_conn berichtly_conn 50;

# Von Nginx selbst erzeugte Fehler im einheitlichen JSON-Format der API (Antworten von Node.js werden
# unverändert durchgereicht – proxy_intercept_errors bleibt aus).
error_page 429 = @berichtly_429;
error_page 413 = @berichtly_413;
error_page 502 503 504 = @berichtly_503;

location /api/ {
    limit_req zone=berichtly_api burst=100 nodelay;
    include /etc/nginx/snippets/berichtly-proxy.conf;
}

# Anmeldung, Registrierung, Token-Erneuerung und Passwortänderung: strengere Grundgrenze.
location /api/v1/auth/ {
    limit_req zone=berichtly_auth burst=20 nodelay;
    include /etc/nginx/snippets/berichtly-proxy.conf;
}
location = /api/v1/account/password {
    limit_req zone=berichtly_auth burst=10 nodelay;
    include /etc/nginx/snippets/berichtly-proxy.conf;
}

# "/api" ohne Schrägstrich: sonst leitet Nginx automatisch (301) auf "/api/" um.
location = /api {
    types { }
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Der angeforderte Endpunkt existiert nicht.","requestId":"$berichtly_request_id","details":null,"conflict":null}}';
}

# Interner Statusbereich ist von außen nie erreichbar (nur direkt am Server mit Token).
location /internal/ {
    return 404;
}

# Alles außerhalb der API: nicht vorhanden.
location / {
    types { }   # Content-Type nie aus der Dateiendung ableiten (z. B. /index.html)
    default_type application/json;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Der angeforderte Endpunkt existiert nicht.","requestId":"$berichtly_request_id","details":null,"conflict":null}}';
}

location @berichtly_429 {
    types { }   # Content-Type nie aus der Dateiendung ableiten (z. B. /index.html)
    default_type application/json;
    add_header Retry-After 1 always;
    add_header X-Request-ID $berichtly_request_id always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Zu viele Anfragen. Bitte kurz warten und erneut versuchen.","requestId":"$berichtly_request_id","details":null,"conflict":null}}';
}

location @berichtly_413 {
    types { }   # Content-Type nie aus der Dateiendung ableiten (z. B. /index.html)
    default_type application/json;
    add_header X-Request-ID $berichtly_request_id always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Die Anfrage ist zu groß.","requestId":"$berichtly_request_id","details":null,"conflict":null}}';
}

location @berichtly_503 {
    types { }   # Content-Type nie aus der Dateiendung ableiten (z. B. /index.html)
    default_type application/json;
    add_header Retry-After 5 always;
    add_header X-Request-ID $berichtly_request_id always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Der Dienst ist vorübergehend nicht verfügbar. Bitte später erneut versuchen.","requestId":"$berichtly_request_id","details":null,"conflict":null}}';
}
