# Berichtly Server 2.2 – Weboberfläche für Konten (optional, standardmäßig NICHT eingebunden).
# Ziel: /etc/nginx/snippets/berichtly-web.conf
#
# Einbinden nur im HTTPS-Server-Block:
#     include /etc/nginx/snippets/berichtly-web.conf;
# und zusätzlich in der .env: WEB_APP_ENABLED=true
#
# Die Weboberfläche ist eine statische Seite (HTML, CSS, JavaScript-Module) und spricht nur die bestehende API.

location /app {
    limit_req zone=berichtly_api burst=50 nodelay;
    include /etc/nginx/snippets/berichtly-proxy.conf;
}
