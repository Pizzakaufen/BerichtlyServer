# Berichtly Server 1.2 – Nginx-Einstellungen im http-Kontext (eingebunden von den Vorlagen in templates/).
# Ziel: /etc/nginx/snippets/berichtly-http-context.conf

# --- Request-ID ---------------------------------------------------------------------------------
# Eine gültige X-Request-ID der App wird übernommen, sonst erzeugt Nginx eine. Node.js verwendet dieselbe ID
# in Antwort und Log – so lassen sich Nginx- und Server-Log einer Anfrage zuordnen.
map $http_x_request_id $berichtly_request_id {
    "~^[A-Za-z0-9_-]{8,64}$" $http_x_request_id;
    default                  $request_id;
}

# HSTS nur über HTTPS (über HTTP wäre der Header wirkungslos und wird nicht gesendet).
map $scheme $berichtly_hsts {
    https   "max-age=31536000";
    default "";
}

# --- Rate Limiting (Grundschutz) ----------------------------------------------------------------
# Nginx begrenzt grob pro Client-IP; Node.js begrenzt zusätzlich fein (Login pro IP und pro Konto,
# Registrierung, Token-Erneuerung). Werte großzügig, damit normale App-Synchronisierung nie gebremst wird.
limit_req_zone $binary_remote_addr zone=berichtly_api:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=berichtly_auth:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=berichtly_conn:10m;
limit_req_status 429;
limit_conn_status 429;

# --- Zugriffslog als JSON (ohne Query-Strings, Header, Bodies oder Tokens) ---------------------------
log_format berichtly_json escape=json
    '{"time":"$time_iso8601","request_id":"$berichtly_request_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,"upstream_s":"$upstream_response_time","protocol":"$server_protocol",'
    '"user_agent":"$http_user_agent"}';
