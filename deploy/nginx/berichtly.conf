# Nginx als Reverse Proxy mit HTTPS vor Berichtly Server.
# Nach /etc/nginx/sites-available/berichtly kopieren, Domain anpassen, Zertifikat beziehen
# (z. B. certbot), verlinken und nginx neu laden.
#
# Im Server setzen:  SERVER_HOST=127.0.0.1  TRUST_PROXY=true

server {
    listen 80;
    listen [::]:80;
    server_name berichtly.example.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name berichtly.example.de;

    ssl_certificate     /etc/letsencrypt/live/berichtly.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/berichtly.example.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # Muss zu MAX_REQUEST_BODY_BYTES passen.
    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Interner Statusbereich bleibt intern.
    location /internal/ { return 404; }
    location / { return 404; }
}
