openapi: 3.0.3
info:
  title: Berichtly Server API
  version: 1.2.0
  description: |
    REST-API des Berichtly Servers – Linux-Backend und Synchronisationsplattform für die Berichtly-Android-App.

    ## Konventionen
    - Alle Endpunkte liegen unter `/api/v1`. Inkompatible Änderungen erscheinen später unter `/api/v2`;
      v1 bleibt dann für bestehende App-Versionen erhalten. 1.1 hat v1 nur kompatibel erweitert
      (neue Endpunkte, neue optionale Felder); 1.2 (Node.js) ändert an v1 nichts – siehe docs/UPGRADE.md.
    - Erfolgreiche Antworten: `{"data": ...}`. Listen zusätzlich `{"meta": {page, limit, total, hasMore}}`.
    - Fehler: `{"error": {"code", "message", "requestId", "details", "conflict"}}` mit stabilem `code`.
      Es werden nie Stacktraces, SQL oder interne Pfade gesendet.
    - Zeitpunkte: UTC, ISO-8601 mit Millisekunden (`2026-10-05T08:15:00.000Z`) und immer **Serverzeit**.
      Vom Gerät gemeldete Zeiten stehen getrennt in `clientUpdatedAt` und werden nie für Entscheidungen genutzt.
    - Kalenderdaten: `YYYY-MM-DD`, interpretiert in der Zeitzone des Kontos (z. B. `Europe/Berlin`).
    - IDs sind UUIDs. Berichts-IDs vergibt idealerweise das Gerät (stabil, bei Wiederholung identisch).
    - Felder mit `readOnly: true` erzeugt der Server; vom Client gesendete Werte werden ignoriert.
    - Unbekannte Felder in Anfragen werden ignoriert (Vorwärtskompatibilität).
    - Jede Antwort enthält `X-Request-ID`; ein gültiger Wert des Clients (8–64 Zeichen `[A-Za-z0-9_-]`) wird übernommen.

    ## Pagination
    - Listen (Berichte, Geräte, Sitzungen, Sicherheitsereignisse): `page` (ab 1) und `limit` (1–100, Standard 50),
      Antwort mit `meta.total` und `meta.hasMore`.
    - Synchronisierung: Cursor-basiert (`cursor`/`nextCursor`, `hasMore`) – stabil auch bei gleichzeitigen Änderungen.
      Cursor sind undurchsichtige Strings (`"1043"` bzw. ab der ersten Bereinigung `"1043.2"`) und werden unverändert
      zurückgegeben. `410 SYNC_CURSOR_EXPIRED` bedeutet: vollständig neu synchronisieren (`cursor=0`).

    ## Authentifizierung
    `Authorization: Bearer <accessToken>`. Access Tokens gelten standardmäßig 15 Minuten. Refresh Tokens werden bei
    jeder Erneuerung ausgetauscht; die erneute Verwendung eines alten Refresh Tokens beendet die Sitzung.
    Refresh-Aufrufe nie parallel ausführen.

    ## Optimistische Sperre und Konflikte
    Ändern und Löschen benötigen die Version, auf der die Änderung basiert. Weicht die Serverversion ab, antwortet
    der Server mit `409 CONFLICT` (REST) bzw. `status: CONFLICT` (Sync) und dem aktuellen Serverstand –
    es wird nie stillschweigend überschrieben ("kein Last-Write-Wins").

    ## Rate Limiting
    Überschreitungen werden mit `429 RATE_LIMITED` und Header `Retry-After` (Sekunden) beantwortet.
    Nginx begrenzt zusätzlich grob pro IP; auch diese Antworten haben das Fehlerformat der API.

    ## Betrieb hinter Nginx (HTTPS)
    - Öffentlich erreichbar ist nur Nginx: `https://<domain>/api/v1/...` (TLS 1.2/1.3, HSTS). HTTP-Anfragen werden mit
      `308` auf HTTPS umgeleitet – die App muss trotzdem immer `https://` verwenden, damit Tokens nie unverschlüsselt
      übertragen werden. Der Node.js-Server selbst lauscht nur intern (127.0.0.1:3000 bzw. im Docker-Netz).
    - Nginx reicht Methode, Pfad, Query, Body, Statuscode und alle Header (auch `Authorization`) unverändert durch und
      setzt `X-Forwarded-For`, `X-Forwarded-Proto`, `X-Real-IP` und `X-Request-ID`.
    - Maximale Request-Größe 1 MiB (Nginx und Server): größere Anfragen erhalten `413 PAYLOAD_TOO_LARGE`.
    - Ist der Server vorübergehend nicht erreichbar (Neustart, Update, Datenbankausfall), antwortet Nginx bzw. der
      Server mit `503 SERVICE_UNAVAILABLE` und `Retry-After`. Die App sollte dann später erneut versuchen; Schreibvorgänge
      mit `operationId` (Sync) können gefahrlos wiederholt werden.
    - Nur unter `/api/` gibt es Inhalte; `/internal/` ist über Nginx nie erreichbar.
servers:
  - url: https://{domain}
    description: Produktion hinter Nginx (HTTPS)
    variables:
      domain: { default: berichtly.example.de, description: Domain des eigenen Servers (BERICHTLY_DOMAIN) }
  - url: /
    description: Gleicher Host (z. B. Swagger UI unter /api/docs)
security:
  - bearerAuth: []
tags:
  - { name: System, description: Health-, Liveness- und Readiness-Prüfungen }
  - { name: Auth, description: Registrierung, Anmeldung, Token-Erneuerung, Abmeldung }
  - { name: Konto, description: Konto, Passwort, Sitzungen, Sicherheitsereignisse }
  - { name: Profil }
  - { name: Tagesberichte }
  - { name: Wochenberichte }
  - { name: Wochen }
  - { name: Synchronisierung }
  - { name: Geräte }

paths:
  /api/v1/health:
    get:
      tags: [System]
      summary: Health-Check (Server und Datenbank)
      security: []
      responses:
        "200": { description: Gesund, content: { application/json: { schema: { $ref: "#/components/schemas/HealthEnvelope" } } } }
        "503": { description: Datenbank nicht erreichbar, content: { application/json: { schema: { $ref: "#/components/schemas/HealthEnvelope" } } } }
  /api/v1/health/live:
    get:
      tags: [System]
      summary: Liveness – Prozess antwortet (ohne Datenbankprüfung)
      security: []
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HealthEnvelope" } } } }
  /api/v1/health/ready:
    get:
      tags: [System]
      summary: Readiness – Datenbank erreichbar und Schema aktuell (1.1)
      security: []
      responses:
        "200": { description: Bereit, content: { application/json: { schema: { $ref: "#/components/schemas/HealthEnvelope" } } } }
        "503": { description: Nicht bereit, content: { application/json: { schema: { $ref: "#/components/schemas/HealthEnvelope" } } } }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Konto registrieren
      description: Rate-limitiert (RATE_LIMIT_REGISTER_PER_MINUTE). Abschaltbar mit REGISTRATION_ENABLED=false.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RegisterRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "201": { description: Konto angelegt, content: { application/json: { schema: { $ref: "#/components/schemas/AuthEnvelope" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Anmelden (optional mit Geräteangabe)
      description: |
        Rate-limitiert pro IP (RATE_LIMIT_LOGIN_PER_MINUTE) und pro Konto (RATE_LIMIT_LOGIN_PER_ACCOUNT_PER_MINUTE).
        Nach zu vielen Fehlversuchen wird das Konto vorübergehend gesperrt (`ACCOUNT_TEMPORARILY_LOCKED`).
        Mit `device` wird die Sitzung an ein Gerät gebunden (für Geräteverwaltung und Sync-Status).
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Angemeldet, content: { application/json: { schema: { $ref: "#/components/schemas/AuthEnvelope" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Token-Paar erneuern (Refresh Token wird ausgetauscht)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [refreshToken], properties: { refreshToken: { type: string, example: "brt_..." } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Neues Token-Paar, content: { application/json: { schema: { $ref: "#/components/schemas/AuthEnvelope" } } } }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Aktuelle Sitzung beenden (Access und Refresh Token sofort ungültig)
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "204": { description: Abgemeldet }
        "401": { $ref: "#/components/responses/Error" }
  /api/v1/auth/logout-all:
    post:
      tags: [Auth]
      summary: Alle Sitzungen auf allen Geräten beenden (1.1)
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200":
          description: Abgemeldet
          content:
            application/json:
              schema: { type: object, properties: { data: { type: object, properties: { revokedSessions: { type: integer } } } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/account:
    get:
      tags: [Konto]
      summary: Eigenes Konto abrufen
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Konto, content: { application/json: { schema: { $ref: "#/components/schemas/AccountEnvelope" } } } }
    patch:
      tags: [Konto]
      summary: Kontoeinstellungen ändern (Zeitzone)
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, properties: { timezone: { type: string, example: Europe/Berlin, description: IANA-Zeitzone } } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Konto, content: { application/json: { schema: { $ref: "#/components/schemas/AccountEnvelope" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/account/password:
    post:
      tags: [Konto]
      summary: Passwort ändern (1.1)
      description: Widerruft alle anderen Sitzungen des Kontos; die aktuelle Sitzung bleibt bestehen. Rate-limitiert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "204": { description: Geändert }
        "401": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/account/security-events:
    get:
      tags: [Konto]
      summary: Eigene Sicherheitsereignisse (neueste zuerst, 1.1)
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200":
          description: Ereignisse
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/SecurityEvent" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /api/v1/sessions:
    get:
      tags: [Konto]
      summary: Aktive Sitzungen des Kontos (1.1)
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200":
          description: Sitzungen
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Session" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /api/v1/sessions/{id}:
    delete:
      tags: [Konto]
      summary: Eine eigene Sitzung beenden (1.1)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "204": { description: Beendet }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/profile:
    get:
      tags: [Profil]
      summary: Eigenes Profil abrufen
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Profil, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileEnvelope" } } } }
    put:
      tags: [Profil]
      summary: Eigenes Profil ersetzen (mit Basisversion)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Profil, content: { application/json: { schema: { $ref: "#/components/schemas/ProfileEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/daily-reports:
    get:
      tags: [Tagesberichte]
      summary: Eigene Tagesberichte auflisten (gefiltert, paginiert)
      description: Zeitraumfilter werden kombiniert (Schnittmenge). Gelöschte Berichte erscheinen nicht.
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: from, in: query, schema: { type: string, format: date }, description: inklusive }
        - { name: to, in: query, schema: { type: string, format: date }, description: inklusive }
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 }, description: Kalenderjahr (1.1) }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 }, description: Monat, nur mit year (1.1) }
        - { name: isoYear, in: query, schema: { type: integer }, description: ISO-Wochenjahr, nur mit isoWeek (1.1) }
        - { name: isoWeek, in: query, schema: { type: integer, minimum: 1, maximum: 53 }, description: ISO-Kalenderwoche (1.1) }
        - { name: status, in: query, schema: { type: string }, description: "Kommagetrennt, z. B. DRAFT,EDITED" }
        - { name: sort, in: query, schema: { type: string, enum: [date_desc, date_asc], default: date_desc } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/DailyReport" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      tags: [Tagesberichte]
      summary: Tagesbericht erstellen
      description: |
        Optional mit Client-`id`. Existiert die ID bereits mit identischem Inhalt, antwortet der Server mit `200`
        (idempotente Wiederholung), bei anderem Inhalt mit `409` (`ALREADY_EXISTS`).
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DailyReportRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "201": { description: Erstellt, content: { application/json: { schema: { $ref: "#/components/schemas/DailyReportEnvelope" } } } }
        "200": { description: Bereits identisch vorhanden, content: { application/json: { schema: { $ref: "#/components/schemas/DailyReportEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/daily-reports/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Tagesberichte]
      summary: Tagesbericht abrufen
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Bericht, content: { application/json: { schema: { $ref: "#/components/schemas/DailyReportEnvelope" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Tagesberichte]
      summary: Tagesbericht ersetzen (Feld `version` = Basisversion, Pflicht)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DailyReportRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Aktualisiert, content: { application/json: { schema: { $ref: "#/components/schemas/DailyReportEnvelope" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Tagesberichte]
      summary: Tagesbericht löschen (Soft-Delete/Tombstone, idempotent)
      parameters: [{ $ref: "#/components/parameters/Version" }]
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "204": { description: Gelöscht }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/weekly-reports:
    get:
      tags: [Wochenberichte]
      summary: Eigene Wochenberichte auflisten
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: Wochen, die den Zeitraum überschneiden }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: year, in: query, schema: { type: integer } }
        - { name: month, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: isoYear, in: query, schema: { type: integer } }
        - { name: isoWeek, in: query, schema: { type: integer, minimum: 1, maximum: 53 } }
        - { name: status, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [date_desc, date_asc] } }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200":
          description: Liste
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/WeeklyReport" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
    post:
      tags: [Wochenberichte]
      summary: Wochenbericht erstellen (ein aktiver Bericht pro Woche)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WeeklyReportRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "201": { description: Erstellt, content: { application/json: { schema: { $ref: "#/components/schemas/WeeklyReportEnvelope" } } } }
        "200": { description: Bereits identisch vorhanden, content: { application/json: { schema: { $ref: "#/components/schemas/WeeklyReportEnvelope" } } } }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/weekly-reports/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Wochenberichte]
      summary: Wochenbericht abrufen
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Bericht, content: { application/json: { schema: { $ref: "#/components/schemas/WeeklyReportEnvelope" } } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [Wochenberichte]
      summary: Wochenbericht ersetzen (Feld `version` Pflicht)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WeeklyReportRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Aktualisiert, content: { application/json: { schema: { $ref: "#/components/schemas/WeeklyReportEnvelope" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Wochenberichte]
      summary: Wochenbericht löschen (Soft-Delete/Tombstone)
      parameters: [{ $ref: "#/components/parameters/Version" }]
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "204": { description: Gelöscht }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/weeks/current:
    get:
      tags: [Wochen]
      summary: Aktuelle Woche (Montag–Sonntag) in der Zeitzone des Benutzers
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Wochenübersicht, content: { application/json: { schema: { $ref: "#/components/schemas/WeekEnvelope" } } } }
  /api/v1/weeks/{date}:
    get:
      tags: [Wochen]
      summary: Woche (Montag–Sonntag), die das Datum enthält
      parameters: [{ name: date, in: path, required: true, schema: { type: string, format: date } }]
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Wochenübersicht, content: { application/json: { schema: { $ref: "#/components/schemas/WeekEnvelope" } } } }
        "400": { $ref: "#/components/responses/Error" }
  /api/v1/weeks/{isoYear}/{isoWeek}:
    get:
      tags: [Wochen]
      summary: Woche nach ISO-Kalenderwoche, z. B. /weeks/2026/41 (1.1)
      parameters:
        - { name: isoYear, in: path, required: true, schema: { type: integer } }
        - { name: isoWeek, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 53 } }
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Wochenübersicht, content: { application/json: { schema: { $ref: "#/components/schemas/WeekEnvelope" } } } }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/sync:
    post:
      tags: [Synchronisierung]
      summary: Synchronisationsschritt – lokale Änderungen hochladen und Serveränderungen abrufen (1.1)
      description: |
        Wendet zuerst `changes` an (jede Änderung einzeln und atomar, idempotent über `operationId`) und liefert
        danach die Serveränderungen ab `cursor`. Eigene Änderungen dieses Schritts sind mit `echo: true` markiert.
        Bei `pull.hasMore = true` weitere Seiten über `GET /sync/changes` abrufen, zum Schluss `POST /sync/complete`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Ergebnis, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/SyncResponse" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/sync/complete:
    post:
      tags: [Synchronisierung]
      summary: Ergebnis eines Synchronisationsvorgangs melden (1.1)
      description: |
        Erfordert eine an ein Gerät gebundene Sitzung (Login mit `device` oder `POST /devices`), sonst `409 DEVICE_REQUIRED`.
        SUCCESS speichert Zeitpunkt und Cursor der letzten erfolgreichen Synchronisierung (Status CONFLICT bei
        `unresolvedConflicts > 0`). FAILED wird nie als Erfolg gespeichert.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncCompleteRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Neuer Gerätestatus, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/SyncDeviceStatus" } } } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/sync/changes:
    get:
      tags: [Synchronisierung]
      summary: Änderungen seit einem Cursor abrufen (inklusive Tombstones)
      parameters:
        - { name: cursor, in: query, schema: { type: string, default: "0" }, description: "`nextCursor` des letzten Abrufs; 0 = alles" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Änderungen, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/SyncPullResponse" } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/CursorExpired" }
  /api/v1/sync/push:
    post:
      tags: [Synchronisierung]
      summary: Lokale Änderungen hochladen (max. 100 pro Anfrage, jede einzeln verarbeitet)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/SyncPushRequest" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Ergebnis pro Änderung, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/SyncPushResponse" } } } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/v1/sync/status:
    get:
      tags: [Synchronisierung]
      summary: Synchronisationsstand (Server-Cursor, gültiger Mindest-Cursor, Gerätestatus)
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Status, content: { application/json: { schema: { type: object, properties: { data: { $ref: "#/components/schemas/SyncStatus" } } } } } }

  /api/v1/devices:
    post:
      tags: [Geräte]
      summary: Gerät registrieren und aktuelle Sitzung daran binden (1.1)
      description: Idempotent über die stabile Geräte-ID. Ein abgemeldetes Gerät wird dadurch wieder aktiv.
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceInfo" } } } }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "201": { description: Neu registriert, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceEnvelope" } } } }
        "200": { description: Bereits bekannt, aktualisiert, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceEnvelope" } } } }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [Geräte]
      summary: Eigene Geräte auflisten (paginiert)
      parameters:
        - { name: includeRevoked, in: query, schema: { type: boolean, default: false }, description: Auch abgemeldete Geräte (1.1) }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200":
          description: Geräte
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Device" } }
                  meta: { $ref: "#/components/schemas/PageMeta" }
  /api/v1/devices/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Geräte]
      summary: Eigenes Gerät abrufen (1.1)
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Gerät, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceEnvelope" } } } }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [Geräte]
      summary: Geräteangaben ändern (1.1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Nicht gesendete Felder bleiben unverändert.
              properties:
                name: { type: string, maxLength: 100 }
                platform: { type: string, maxLength: 32 }
                osVersion: { type: string, maxLength: 32 }
                appVersion: { type: string, maxLength: 32 }
      responses:
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "200": { description: Gerät, content: { application/json: { schema: { $ref: "#/components/schemas/DeviceEnvelope" } } } }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Geräte]
      summary: Gerät abmelden (alle Sitzungen des Geräts widerrufen; Berichte bleiben erhalten)
      responses:
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "204": { description: Abgemeldet }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Version: { name: version, in: query, required: true, description: Basisversion, schema: { type: integer, minimum: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }

  responses:
    Error:
      description: Fehler
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ValidationError:
      description: Validierungsfehler (`VALIDATION_FAILED`) mit `details`
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    Conflict:
      description: Konflikt (`CONFLICT`) mit aktuellem Serverstand in `error.conflict`
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    RateLimited:
      description: Zu viele Anfragen (`RATE_LIMITED`) bzw. Konto vorübergehend gesperrt (`ACCOUNT_TEMPORARILY_LOCKED`)
      headers: { Retry-After: { schema: { type: integer }, description: Sekunden bis zum nächsten Versuch } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    ServiceUnavailable:
      description: Vorübergehend nicht verfügbar (`SERVICE_UNAVAILABLE`) – Neustart, Update oder Datenbank nicht erreichbar
      headers: { Retry-After: { schema: { type: integer }, description: Sekunden bis zum nächsten Versuch } }
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    PayloadTooLarge:
      description: Request-Body größer als 1 MiB (`PAYLOAD_TOO_LARGE`)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }
    CursorExpired:
      description: Cursor älter als bereinigte Löschinformationen (`SYNC_CURSOR_EXPIRED`) – vollständig neu synchronisieren (cursor=0)
      content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } }

  schemas:
    ReportStatus: { type: string, enum: [DRAFT, GENERATED, EDITED, FINALIZED] }
    WritingStyle: { type: string, enum: [NEUTRAL, FORMAL, SIMPLE, DETAILED] }
    PageMeta:
      type: object
      readOnly: true
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer, format: int64 }
        hasMore: { type: boolean }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [VALIDATION_FAILED, INVALID_REQUEST_BODY, INVALID_PARAMETER, UNAUTHORIZED, INVALID_CREDENTIALS,
                     INVALID_REFRESH_TOKEN, ACCOUNT_DISABLED, ACCOUNT_TEMPORARILY_LOCKED, REGISTRATION_DISABLED,
                     EMAIL_ALREADY_REGISTERED, NOT_FOUND, METHOD_NOT_ALLOWED, CONFLICT, PAYLOAD_TOO_LARGE,
                     UNSUPPORTED_MEDIA_TYPE, RATE_LIMITED, INTERNAL_ERROR, SERVICE_UNAVAILABLE, SYNC_CURSOR_EXPIRED,
                     DEVICE_REQUIRED, OPERATION_ID_REUSED]
            message: { type: string }
            requestId: { type: string }
            details:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  field: { type: string, example: text }
                  issue: { type: string, example: "too_long:max=5000" }
            conflict: { $ref: "#/components/schemas/ConflictInfo" }
    ConflictInfo:
      type: object
      nullable: true
      properties:
        reason: { type: string, enum: [VERSION_MISMATCH, DELETED_ON_SERVER, ALREADY_EXISTS, DUPLICATE_WEEK, ID_UNAVAILABLE] }
        serverVersion: { type: integer, nullable: true }
        serverRecord: { type: object, nullable: true, description: Aktueller Datensatz auf dem Server (null bei gelöschten oder fremden Datensätzen) }
    HealthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, unavailable, ready, not_ready] }
            components: { type: object, additionalProperties: { type: string }, example: { api: up, database: up, schema: current } }
    DeviceInfo:
      type: object
      description: Angaben zum Gerät. Bewusst keine Hardware-Kennungen, Seriennummern oder Standortdaten.
      required: [id]
      properties:
        id: { type: string, format: uuid, description: Stabile, auf dem Gerät einmalig erzeugte UUID }
        name: { type: string, maxLength: 100, example: Pixel 9 }
        platform: { type: string, maxLength: 32, default: ANDROID }
        osVersion: { type: string, maxLength: 32, example: "15" }
        appVersion: { type: string, maxLength: 32, example: "2.2.0" }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        timezone: { type: string, example: Europe/Berlin }
        device: { $ref: "#/components/schemas/DeviceInfo" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
        device: { $ref: "#/components/schemas/DeviceInfo" }
    Account:
      type: object
      readOnly: true
      properties:
        id: { type: string, format: uuid, description: Stabile Benutzer-ID }
        email: { type: string }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
    AccountEnvelope: { type: object, properties: { data: { $ref: "#/components/schemas/Account" } } }
    AuthEnvelope:
      type: object
      properties:
        data:
          type: object
          properties:
            account: { $ref: "#/components/schemas/Account" }
            tokens:
              type: object
              properties:
                tokenType: { type: string, example: Bearer }
                accessToken: { type: string }
                accessTokenExpiresAt: { type: string, format: date-time }
                expiresIn: { type: integer, description: Sekunden }
                refreshToken: { type: string }
                refreshTokenExpiresAt: { type: string, format: date-time }
                sessionId: { type: string, format: uuid }
    Session:
      type: object
      readOnly: true
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid, nullable: true }
        deviceName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time, description: Auf etwa eine Minute genau }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean }
    SecurityEvent:
      type: object
      readOnly: true
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [REGISTERED, LOGIN_SUCCEEDED, LOGIN_FAILED, ACCOUNT_LOCKED, LOGOUT, LOGOUT_ALL, REFRESH_TOKEN_REUSE,
                 SESSION_REVOKED, DEVICE_REVOKED, PASSWORD_CHANGED, PASSWORD_CHANGE_FAILED]
        sessionId: { type: string, format: uuid, nullable: true }
        deviceId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid, readOnly: true, description: Entspricht der Benutzer-ID }
        name: { type: string }
        profession: { type: string }
        company: { type: string }
        department: { type: string }
        trainerName: { type: string }
        trainingStart: { type: string, format: date, nullable: true }
        trainingEnd: { type: string, format: date, nullable: true }
        writingStyle: { $ref: "#/components/schemas/WritingStyle" }
        version: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time, readOnly: true }
        updatedAt: { type: string, format: date-time, readOnly: true }
    ProfileEnvelope: { type: object, properties: { data: { $ref: "#/components/schemas/Profile" } } }
    ProfileRequest:
      type: object
      required: [version]
      description: Vollständiger Inhalt; nicht gesendete Textfelder werden geleert.
      properties:
        version: { type: integer, minimum: 1, description: Basisversion }
        name: { type: string, maxLength: 120 }
        profession: { type: string, maxLength: 120 }
        company: { type: string, maxLength: 160 }
        department: { type: string, maxLength: 120 }
        trainerName: { type: string, maxLength: 120 }
        trainingStart: { type: string, format: date, nullable: true }
        trainingEnd: { type: string, format: date, nullable: true }
        writingStyle: { $ref: "#/components/schemas/WritingStyle" }
    Origin:
      type: object
      description: Herkunft der letzten Änderung (1.1). Nur informativ, nie Grundlage von Entscheidungen.
      properties:
        clientUpdatedAt: { type: string, format: date-time, nullable: true, description: Vom Gerät gemeldete Zeit (Clientzeit) }
        clientLocalId: { type: string, nullable: true, description: Lokale ID auf dem Gerät (z. B. Room-ID) }
        createdByDeviceId: { type: string, format: uuid, nullable: true, readOnly: true }
        lastModifiedByDeviceId: { type: string, format: uuid, nullable: true, readOnly: true }
        lastOperationId: { type: string, format: uuid, nullable: true, readOnly: true }
    ClientInfo:
      type: object
      description: Optionale Clientangaben zu einer Änderung (1.1)
      properties:
        clientUpdatedAt: { type: string, format: date-time }
        clientLocalId: { type: string, maxLength: 64, pattern: "^[A-Za-z0-9._:-]{1,64}$" }
    DailyReport:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            date: { type: string, format: date }
            text: { type: string }
            note: { type: string }
            orderIndex: { type: integer }
            status: { $ref: "#/components/schemas/ReportStatus" }
            version: { type: integer, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true, description: Serverzeit }
            updatedAt: { type: string, format: date-time, readOnly: true, description: Serverzeit }
            deleted: { type: boolean, readOnly: true }
            deletedAt: { type: string, format: date-time, nullable: true, readOnly: true }
        - $ref: "#/components/schemas/Origin"
    DailyReportEnvelope: { type: object, properties: { data: { $ref: "#/components/schemas/DailyReport" } } }
    DailyReportRequest:
      allOf:
        - type: object
          required: [date, text]
          properties:
            id: { type: string, format: uuid, description: Optional beim Erstellen (empfohlen, vom Gerät erzeugt) }
            version: { type: integer, description: Basisversion – Pflicht bei PUT }
            date: { type: string, format: date }
            text: { type: string, minLength: 1, maxLength: 5000 }
            note: { type: string, maxLength: 2000 }
            orderIndex: { type: integer, minimum: 0, maximum: 10000, default: 0 }
            status: { $ref: "#/components/schemas/ReportStatus" }
        - $ref: "#/components/schemas/ClientInfo"
    WeeklyReport:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid }
            weekStart: { type: string, format: date }
            weekEnd: { type: string, format: date, readOnly: true }
            isoYear: { type: integer, readOnly: true }
            isoWeek: { type: integer, readOnly: true }
            content: { type: string }
            status: { $ref: "#/components/schemas/ReportStatus" }
            generatedAt: { type: string, format: date-time, nullable: true }
            version: { type: integer, readOnly: true }
            createdAt: { type: string, format: date-time, readOnly: true }
            updatedAt: { type: string, format: date-time, readOnly: true }
            deleted: { type: boolean, readOnly: true }
            deletedAt: { type: string, format: date-time, nullable: true, readOnly: true }
        - $ref: "#/components/schemas/Origin"
    WeeklyReportEnvelope: { type: object, properties: { data: { $ref: "#/components/schemas/WeeklyReport" } } }
    WeeklyReportRequest:
      allOf:
        - type: object
          required: [weekStart]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer, description: Basisversion – Pflicht bei PUT }
            weekStart: { type: string, format: date, description: Muss ein Montag sein }
            content: { type: string, maxLength: 50000 }
            status: { $ref: "#/components/schemas/ReportStatus" }
            generatedAt: { type: string, format: date-time, nullable: true }
        - $ref: "#/components/schemas/ClientInfo"
    WeekEnvelope:
      type: object
      properties:
        data:
          type: object
          readOnly: true
          properties:
            weekStart: { type: string, format: date }
            weekEnd: { type: string, format: date }
            isoYear: { type: integer }
            isoWeek: { type: integer }
            timezone: { type: string }
            today: { type: string, format: date, description: "Heute in der Zeitzone des Benutzers (1.1)" }
            days:
              type: array
              items:
                type: object
                properties:
                  date: { type: string, format: date }
                  dayOfWeek: { type: string, example: MONDAY }
                  dailyReports: { type: array, items: { $ref: "#/components/schemas/DailyReport" } }
            weeklyReport: { allOf: [{ $ref: "#/components/schemas/WeeklyReport" }], nullable: true }
    SyncChange:
      type: object
      readOnly: true
      properties:
        type: { type: string, enum: [DAILY_REPORT, WEEKLY_REPORT, PROFILE] }
        id: { type: string, format: uuid }
        version: { type: integer }
        changeSeq: { type: integer, format: int64 }
        deleted: { type: boolean }
        updatedAt: { type: string, format: date-time, description: Serverzeit }
        echo: { type: boolean, description: "Nur bei POST /sync: eigene Änderung aus derselben Anfrage" }
        data: { type: object, nullable: true, description: Datensatz wie bei REST; null bei Tombstones }
    SyncPullResponse:
      type: object
      properties:
        changes: { type: array, items: { $ref: "#/components/schemas/SyncChange" } }
        nextCursor: { type: string }
        hasMore: { type: boolean }
        serverTime: { type: string, format: date-time }
    SyncPushItem:
      allOf:
        - type: object
          required: [type, operation, id]
          properties:
            operationId: { type: string, format: uuid, description: "Eindeutig je Änderung, bei Wiederholung identisch (empfohlen, 1.1)" }
            type: { type: string, enum: [DAILY_REPORT, WEEKLY_REPORT, PROFILE] }
            operation: { type: string, enum: [UPSERT, DELETE] }
            id: { type: string, format: uuid, description: "Bei PROFILE: die eigene Benutzer-ID" }
            baseVersion: { type: integer, nullable: true, description: "null = lokal neu; sonst Version, auf der die Änderung basiert" }
            data: { type: object, description: Inhalt wie bei REST (bei DELETE nicht nötig) }
        - $ref: "#/components/schemas/ClientInfo"
    SyncPushRequest:
      type: object
      required: [changes]
      properties:
        changes: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/SyncPushItem" } }
    SyncPushResult:
      type: object
      readOnly: true
      properties:
        index: { type: integer }
        operationId: { type: string, nullable: true }
        type: { type: string, nullable: true }
        id: { type: string, nullable: true }
        status: { type: string, enum: [APPLIED, CONFLICT, REJECTED] }
        version: { type: integer, nullable: true }
        changeSeq: { type: integer, format: int64, nullable: true }
        record: { type: object, nullable: true }
        conflict: { $ref: "#/components/schemas/ConflictInfo" }
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
        replayed: { type: boolean, description: "Operation wurde bereits früher verarbeitet; es wird nur ihr Ergebnis geliefert (1.1)" }
    SyncPushResponse:
      type: object
      properties:
        results: { type: array, items: { $ref: "#/components/schemas/SyncPushResult" } }
        serverTime: { type: string, format: date-time }
    SyncRequest:
      type: object
      properties:
        cursor: { type: string, default: "0" }
        limit: { type: integer, minimum: 1, maximum: 500, default: 200 }
        changes: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/SyncPushItem" } }
    SyncResponse:
      type: object
      properties:
        push: { $ref: "#/components/schemas/SyncPushResponse" }
        pull: { $ref: "#/components/schemas/SyncPullResponse" }
        device: { allOf: [{ $ref: "#/components/schemas/SyncDeviceStatus" }], nullable: true }
        serverTime: { type: string, format: date-time }
    SyncCompleteRequest:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [SUCCESS, FAILED] }
        cursor: { type: string, description: Lokal übernommener Cursor – Pflicht bei SUCCESS }
        unresolvedConflicts: { type: integer, minimum: 0, default: 0 }
        errorCode: { type: string, pattern: "^[A-Z0-9_]{1,64}$", example: NETWORK_ERROR }
    SyncDeviceStatus:
      type: object
      readOnly: true
      properties:
        deviceId: { type: string, format: uuid }
        syncStatus: { type: string, enum: [NEVER, SUCCESS, FAILED, CONFLICT] }
        lastSyncAt: { type: string, format: date-time, nullable: true, description: Letzte erfolgreiche Synchronisierung }
        lastSuccessfulCursor: { type: string, nullable: true }
        lastSyncStartedAt: { type: string, format: date-time, nullable: true }
        lastFailedSyncAt: { type: string, format: date-time, nullable: true }
        lastSyncErrorCode: { type: string, nullable: true }
        unresolvedConflicts: { type: integer }
        lastPullAt: { type: string, format: date-time, nullable: true }
        lastPullCursor: { type: string, nullable: true }
        lastPushAt: { type: string, format: date-time, nullable: true }
    SyncStatus:
      type: object
      readOnly: true
      properties:
        serverCursor: { type: string, description: Höchste Änderungsnummer des Kontos }
        minValidCursor: { type: string, description: "Cursor älterer Epochen unterhalb dieser Nummer sind abgelaufen (1.1)" }
        cursorEpoch: { type: integer, description: "Aktuelle Cursor-Epoche; steigt bei Tombstone-Bereinigung und nach reset-sync-cursors (1.1)" }
        serverTime: { type: string, format: date-time }
        device: { allOf: [{ $ref: "#/components/schemas/SyncDeviceStatus" }], nullable: true }
    Device:
      type: object
      readOnly: true
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        platform: { type: string }
        osVersion: { type: string }
        appVersion: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        syncStatus: { type: string, enum: [NEVER, SUCCESS, FAILED, CONFLICT] }
        lastSyncAt: { type: string, format: date-time, nullable: true }
        lastSyncStartedAt: { type: string, format: date-time, nullable: true }
        lastFailedSyncAt: { type: string, format: date-time, nullable: true }
        lastSyncErrorCode: { type: string, nullable: true }
        unresolvedConflicts: { type: integer }
        lastPullAt: { type: string, format: date-time, nullable: true }
        lastPushAt: { type: string, format: date-time, nullable: true }
        activeSessions: { type: integer }
        current: { type: boolean }
    DeviceEnvelope: { type: object, properties: { data: { $ref: "#/components/schemas/Device" } } }
